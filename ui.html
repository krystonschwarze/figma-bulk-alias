<html>
<head>
  <style>
    :root {
      /* Light Mode Colors */
      --figma-color-bg: #ffffff;
      --figma-color-bg-secondary: #f5f5f5;
      --figma-color-bg-hover: #f0f0f0;
      --figma-color-border: #e5e5e5;
      --figma-color-text: #333333;
      --figma-color-text-secondary: #666666;
      --figma-color-icon: #333333;
      --figma-color-primary: #18A0FB;
      --figma-color-primary-hover: #0D8DE3;
      --figma-color-success: #1BA673;
      --figma-color-error: #F24822;
      --figma-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      --border-radius-small: 6px;
      --border-radius-medium: 8px;
    }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --figma-color-bg: #2c2c2c;
        --figma-color-bg-secondary: #363636;
        --figma-color-bg-hover: #404040;
        --figma-color-border: #404040;
        --figma-color-text: #ffffff;
        --figma-color-text-secondary: #999999;
        --figma-color-icon: #ffffff;
        --figma-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      color: var(--figma-color-text);
      background-color: var(--figma-color-bg);
      font-size: 11px;
      line-height: 1.5;
    }
    
    .section {
      margin-bottom: 24px;
    }
    
    .section-title {
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--figma-color-border);
      color: var(--figma-color-text);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--figma-color-text-secondary);
      font-size: 11px;
    }
    
    select {
      width: 100%;
      padding: 8px 28px 8px 8px;
      margin-bottom: 12px;
      border-radius: var(--border-radius-small);
      border: 1px solid var(--figma-color-border);
      font-size: 11px;
      color: var(--figma-color-text);
      background-color: var(--figma-color-bg);
      appearance: none;
      background-image: url('data:image/svg+xml;charset=US-ASCII,<svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="%23666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      background-repeat: no-repeat;
      background-position: right 8px center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    select:hover {
      background-color: var(--figma-color-bg-hover);
    }
    
    select:focus {
      outline: none;
      border-color: var(--figma-color-primary);
    }
    
    select:disabled {
      background-color: var(--figma-color-bg-secondary);
      color: var(--figma-color-text-secondary);
      cursor: not-allowed;
    }
    
    button {
      width: 100%;
      padding: 0 16px;
      margin-bottom: 8px;
      border-radius: var(--border-radius-small);
      border: none;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      height: 32px;
      text-align: center;
    }
    
    button#createAliases {
      background: var(--figma-color-primary);
      color: white;
    }
    
    button#createAliases:hover {
      background: var(--figma-color-primary-hover);
    }
    
    button#createAliases:disabled {
      background: var(--figma-color-bg-secondary);
      color: var(--figma-color-text-secondary);
      cursor: not-allowed;
    }
    
    button#removeAliases {
      background: transparent;
      border: 1px solid var(--figma-color-border);
      color: var(--figma-color-text);
    }
    
    button#removeAliases:hover {
      background: var(--figma-color-bg-hover);
    }
    
    button#removeAliases:disabled {
      background: transparent;
      border-color: var(--figma-color-border);
      color: var(--figma-color-text-secondary);
      cursor: not-allowed;
    }
    
    .preview {
      margin: 20px 0;
      padding: 16px;
      border-radius: var(--border-radius-small);
      background: var(--figma-color-bg-secondary);
      border: 1px solid var(--figma-color-border);
    }
    
    .preview h3 {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: var(--figma-color-text-secondary);
      font-weight: 500;
    }
    
    .preview-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 11px;
    }
    
    .preview-item span {
      color: var(--figma-color-text);
    }
    
    .arrow {
      color: var(--figma-color-text-secondary);
      margin: 0 8px;
    }
    
    .message {
      padding: 8px 12px;
      margin: 8px 0;
      border-radius: var(--border-radius-small);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .error {
      background: rgba(242, 72, 34, 0.1);
      color: var(--figma-color-error);
      border: 1px solid rgba(242, 72, 34, 0.2);
    }
    
    .success {
      background: rgba(27, 166, 115, 0.1);
      color: var(--figma-color-success);
      border: 1px solid rgba(27, 166, 115, 0.2);
    }
  </style>
</head>
<body>
  <div class="section">
    <h2 class="section-title">Source Variables</h2>
    <label for="sourceCollection">Collection</label>
    <select id="sourceCollection">
      <option value="">Select Collection...</option>
    </select>
    
    <label for="sourceGroup">Group</label>
    <select id="sourceGroup" disabled>
      <option value="">Select Group...</option>
    </select>
  </div>
  
  <div class="section">
    <h2 class="section-title">Target Variables</h2>
    <label for="targetCollection">Collection</label>
    <select id="targetCollection">
      <option value="">Select Collection...</option>
    </select>
    
    <label for="targetGroup">Group</label>
    <select id="targetGroup" disabled>
      <option value="">Select Group...</option>
    </select>
    
    <label for="mode">Mode</label>
    <select id="mode" disabled>
      <option value="">Select Mode...</option>
    </select>
  </div>
  
  <div class="preview">
    <h3>Preview</h3>
    <div id="previewContent">
      <p>Select source and target groups...</p>
    </div>
  </div>
  
  <button id="createAliases" disabled>Create Aliases</button>
  <button id="removeAliases" class="secondary" disabled>Remove Aliases</button>
  
  <div id="message"></div>

  <script>
    let currentSourceCollection = null;
    let currentTargetCollection = null;
    let currentMode = null;
    let currentSourceGroup = null;
    let currentTargetGroup = null;
    let collections = [];
    
    // Initialize UI
    window.onload = () => {
      parent.postMessage({ pluginMessage: { type: 'get-collections' } }, '*');
    };
    
    // Event Listener for source collection selection
    document.getElementById('sourceCollection').addEventListener('change', (e) => {
      currentSourceCollection = e.target.value;
      const sourceGroupSelect = document.getElementById('sourceGroup');
      
      if (currentSourceCollection) {
        sourceGroupSelect.disabled = false;
        parent.postMessage({ 
          pluginMessage: { 
            type: 'get-groups',
            sourceCollectionId: currentSourceCollection
          }
        }, '*');
      } else {
        sourceGroupSelect.disabled = true;
        sourceGroupSelect.innerHTML = '<option value="">Select Group...</option>';
      }
      updateButtonState();
    });
    
    // Event Listener for target collection selection
    document.getElementById('targetCollection').addEventListener('change', (e) => {
      currentTargetCollection = e.target.value;
      const targetGroupSelect = document.getElementById('targetGroup');
      const modeSelect = document.getElementById('mode');
      
      if (currentTargetCollection) {
        targetGroupSelect.disabled = false;
        modeSelect.disabled = false;
        
        // Update mode dropdown
        updateModeDropdown();
        
        parent.postMessage({ 
          pluginMessage: { 
            type: 'get-groups',
            targetCollectionId: currentTargetCollection
          }
        }, '*');
      } else {
        targetGroupSelect.disabled = true;
        modeSelect.disabled = true;
        targetGroupSelect.innerHTML = '<option value="">Select Group...</option>';
        modeSelect.innerHTML = '<option value="">Select Mode...</option>';
      }
      updateButtonState();
    });
    
    // Event Listener for mode selection
    document.getElementById('mode').addEventListener('change', (e) => {
      currentMode = e.target.value;
      updatePreview();
      updateButtonState();
    });
    
    // Event Listener for source group selection
    document.getElementById('sourceGroup').addEventListener('change', (e) => {
      currentSourceGroup = e.target.value;
      updatePreview();
      updateButtonState();
    });
    
    // Event Listener for target group selection
    document.getElementById('targetGroup').addEventListener('change', (e) => {
      currentTargetGroup = e.target.value;
      updatePreview();
      updateButtonState();
    });
    
    // Event Listener for create aliases button
    document.getElementById('createAliases').addEventListener('click', () => {
      parent.postMessage({ 
        pluginMessage: { 
          type: 'create-aliases',
          sourceCollectionId: currentSourceCollection,
          targetCollectionId: currentTargetCollection,
          modeId: currentMode,
          sourceGroup: currentSourceGroup,
          targetGroup: currentTargetGroup
        }
      }, '*');
    });
    
    // Event Listener for remove aliases button
    document.getElementById('removeAliases').addEventListener('click', () => {
      parent.postMessage({ 
        pluginMessage: { 
          type: 'remove-aliases',
          targetCollectionId: currentTargetCollection,
          modeId: currentMode,
          targetGroup: currentTargetGroup
        }
      }, '*');
    });
    
    function updateModeDropdown() {
      const modeSelect = document.getElementById('mode');
      modeSelect.innerHTML = '<option value="">Select Mode...</option>';
      
      const collection = collections.find(c => c.id === currentTargetCollection);
      if (collection) {
        collection.modes.forEach(mode => {
          const option = document.createElement('option');
          option.value = mode.modeId;
          option.textContent = mode.name;
          modeSelect.appendChild(option);
        });
      }
    }
    
    // Receive messages from plugin
    onmessage = (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'collections') {
        collections = msg.collections;
        const sourceSelect = document.getElementById('sourceCollection');
        const targetSelect = document.getElementById('targetCollection');
        
        // Clear existing options
        sourceSelect.innerHTML = '<option value="">Select Collection...</option>';
        targetSelect.innerHTML = '<option value="">Select Collection...</option>';
        
        collections.forEach(collection => {
          // Add option to source collection
          const sourceOption = document.createElement('option');
          sourceOption.value = collection.id;
          sourceOption.textContent = collection.name;
          sourceSelect.appendChild(sourceOption);
          
          // Add option to target collection
          const targetOption = document.createElement('option');
          targetOption.value = collection.id;
          targetOption.textContent = collection.name;
          targetSelect.appendChild(targetOption);
        });
      }
      
      else if (msg.type === 'groups') {
        const select = msg.forTarget ? 
          document.getElementById('targetGroup') : 
          document.getElementById('sourceGroup');
        
        // Clear existing options
        select.innerHTML = '<option value="">Select Group...</option>';
        
        msg.groups.forEach(group => {
          const option = document.createElement('option');
          option.value = group;
          option.textContent = group;
          select.appendChild(option);
        });
      }
      
      else if (msg.type === 'success' || msg.type === 'error') {
        const messageDiv = document.getElementById('message');
        messageDiv.className = 'message ' + msg.type;
        messageDiv.textContent = msg.message;
        
        // Hide message after 3 seconds
        setTimeout(() => {
          messageDiv.className = '';
          messageDiv.textContent = '';
        }, 3000);
      }
    };
    
    function updateButtonState() {
      const createButton = document.getElementById('createAliases');
      const removeButton = document.getElementById('removeAliases');
      
      const isValid = currentSourceCollection && currentTargetCollection && 
                     currentMode && currentSourceGroup && currentTargetGroup;
      
      createButton.disabled = !isValid;
      removeButton.disabled = !(currentTargetCollection && currentMode && currentTargetGroup);
    }
    
    function updatePreview() {
      const previewContent = document.getElementById('previewContent');
      
      if (currentSourceGroup && currentTargetGroup) {
        const sourceCollection = collections.find(c => c.id === currentSourceCollection);
        const targetCollection = collections.find(c => c.id === currentTargetCollection);
        const mode = currentMode ? collections
          .find(c => c.id === currentTargetCollection)?.modes
          .find(m => m.modeId === currentMode)?.name : '';
        
        previewContent.innerHTML = `
          <div class="preview-item">
            <span>${sourceCollection?.name || ''} / ${currentSourceGroup}</span>
            <span class="arrow">→</span>
            <span>${targetCollection?.name || ''} / ${currentTargetGroup}</span>
          </div>
          ${mode ? `<div style="font-size: 12px; color: #666; margin-top: 8px;">Mode: ${mode}</div>` : ''}
        `;
      } else {
        previewContent.innerHTML = '<p>Select source and target groups...</p>';
      }
    }
  </script>
</body>
</html>
